apiVersion: v1
kind: ConfigMap
metadata:
  name: vipertrade-config
  # Explícito de propósito. O kustomization injeta o namespace em `apply -k`,
  # mas este arquivo é o que se aplica isolado quando se mexe em tuning — e sem
  # a linha o `apply -f` cria um ConfigMap órfão no namespace `default`, que o
  # cluster ignora enquanto reporta "created" como se tivesse funcionado.
  namespace: vipertrade
data:
  # Trading configuration
  TRADING_MODE: paper
  BYBIT_RECV_WINDOW: "5000"
  BYBIT_ACCOUNT_TYPE: UNIFIED

  # Database configuration
  POSTGRES_DB: vipertrade
  POSTGRES_USER: viper
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: vipertrade
  DB_USER: viper

  # Redis configuration
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379

  # Strategy configuration
  STRATEGY_CONFIG: /app/config/trading/pairs.yaml
  TUPA_AUDIT_PATH: /app/logs/audit
  TUPA_SEED: "42"
  TUPA_BACKEND: hybrid
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  LD_LIBRARY_PATH: /usr/local/lib

  # Service URLs (internal K8s DNS)
  WALLET_API_BASE_URL: http://api:8080
  ANALYTICS_SCORES_URL: http://analytics:8086/scores

  # Analytics configuration
  ANALYTICS_MIN_EVALUATED: "20"
  ANALYTICS_HORIZON_MINUTES: "5"
  ANALYTICS_LOOKBACK_HOURS: "24"
  ANALYTICS_SAMPLE_INTERVAL_SECONDS: "5"

  # Trading profile
  TRADING_PROFILE: MEDIUM

  # Scalp DESLIGADO em 2026-08-07. A estratégia de minutos foi encerrada depois
  # de 97 trades e cinco medições independentes sem edge: doze candidatos de
  # sinal sem poder discriminante, e edge bruto de +0,003% contra custo de
  # 0,130%. O corpus final está em ~/vipertrade-config/evidencia/.
  # Esta flag governa apenas o pipeline de scalp — a saída de posições abertas
  # e o swing seguem funcionando com ela em false.
  STRATEGY_REAL_DECISIONS: "false"

  # Alvo como múltiplo do risco (distância entrada->stop).
  #
  # 1,25 desde 2026-08-11. O alvo governa duas coisas: o ganho por acerto E o
  # giro, porque a posição prende o símbolo até fechar. Medido por retorno/DIA,
  # que é a métrica certa quando o parâmetro afeta a frequência:
  #
  #   R:R    trades/dia   corpus completo   fora da amostra
  #   0,75      3,80        +1,066%/dia       +1,015%/dia
  #   1,00      3,33        +0,912%/dia       +1,002%/dia
  #   1,25      3,00        +1,095%/dia       +1,351%/dia   <- escolhido
  #   1,50      2,80        +1,011%/dia       +1,082%/dia
  #   2,00      2,51        +0,767%/dia       +0,747%/dia
  #
  # Girar mais ajuda até 1,25 e passa a atrapalhar abaixo disso: o alvo fica
  # perto demais e o custo fixo come a margem. Continua platô — 1,0 e 1,5 também
  # são positivos nas duas metades.
  #
  # Não afeta posições já abertas: o alvo é gravado no trade na entrada.
  STRATEGY_SWING_RISK_REWARD: "1.25"

  # Espelho short do checklist, habilitado em 2026-08-09.
  #
  # O filtro macro deixa de BLOQUEAR e passa a ESCOLHER o lado: com o BTC acima
  # da própria EMA200 procura-se compra; abaixo, venda. Os dois lados nunca
  # operam ao mesmo tempo.
  #
  # Medido no corpus de 166 dias (universo v5, gestão em 15m, custo real):
  # o short sozinho rende +0,149%/trade contra +0,312% do long — metade — e
  # depende do macro invertido (sem ele, −0,066%). O valor não está no retorno
  # próprio e sim na alternância: o long faz 183 trades na 1ª metade e 48 na 2ª,
  # o short faz 21 e 155. Combinados, o out-of-sample sai de −0,501% (só long)
  # para +0,051%, e o volume vai de 231 para 400 trades.
  #
  # Ressalva registrada: a medição ignora funding, e no short isso pesa mais —
  # em queda o funding costuma inverter e quem está vendido paga. O paper cobra
  # funding real por lado, então o custo aparece nos trades daqui pra frente.
  # Desligar aqui volta ao comportamento anterior sem rebuild.
  STRATEGY_SWING_SHORT_ENABLED: "true"

  # Espera antes de reentrar num símbolo que acabou de ser estopado.
  #
  # Sem isto o sistema recompra em cima do próprio stop: em 2026-08-09 o
  # ENAUSDT foi estopado às 05:23:46 e reentrou às 05:27:16, no preço exato da
  # saída, com stop 2,7x mais apertado porque o fundo estrutural passou a ser o
  # da própria queda. Foi estopado de novo dez minutos depois.
  #
  # Medido no corpus com gestão SEQUENCIAL (uma posição por símbolo, como o
  # executor faz) e velas de 15m: sem cooldown a estratégia rende −0,256%/trade
  # com PF 0,810; com 24h, +0,310%/trade e PF 1,232. Positivo nas duas metades
  # do histórico (+0,302% e +0,333%), e qualquer valor entre 4h e 24h funciona —
  # é o platô que dá confiança, não o pico. 0 desliga.
  STRATEGY_SWING_STOP_COOLDOWN_HOURS: "24"

  # Estratégia de swing em 4H, que substituiu o scalp. Stop estrutural abaixo do
  # fundo e alvo por risco/retorno 2:1. Validada out-of-sample, em símbolos
  # inéditos e contra buy-and-hold antes de entrar em paper.
  STRATEGY_SWING_ENABLED: "true"

  # Executor configuration
  EXECUTOR_ENABLE_LIVE_ORDERS: "false"
  # 12, não 8 (2026-08-08), junto com a ampliação do universo para 23 símbolos.
  # Medido no corpus de 166 dias: 6,97 setups/dia com duração média de 1,39 dias,
  # o que pela lei de Little dá 9,7 posições simultâneas de demanda natural. Com
  # 8 o sistema recusaria setups válidos por falta de vaga, e o corpus ficaria
  # enviesado pelos que chegaram primeiro em vez dos que a regra aprovou.
  # O risco cabe: o cap por posição desceu para 12% do equity e o stop mediano é
  # 2,04%, então cada posição arrisca ~0,28% do capital — 12 delas somam 3,4%,
  # contra o disjuntor de drawdown em 8%. No percentil 90 dos stops seriam 6,2%,
  # ainda abaixo. Não fui a 16 porque aí o p90 passa do disjuntor: em cripto as
  # posições estopam juntas, então o cenário correlacionado não é hipótese remota.
  EXECUTOR_PAPER_MAX_OPEN_POSITIONS: "12"
  EXECUTOR_RECONCILE_FIX: "false"
  # Paper fills are charged the account's real Bybit taker rate, fetched from
  # /v5/account/fee-rate. This is only the fallback for when that call fails
  # (no credentials): Bybit USDT-perp non-VIP taker = 0.055%.
  EXECUTOR_FEE_TAKER_PCT: "0.00055"
  # Disjuntor: para as ENTRADAS quando o equity cai 8% desde o pico (curva
  # realizada). Posições abertas seguem sendo geridas — travar a saída
  # prenderia justamente o risco que o disjuntor quer reduzir. A faixa 5%-10%
  # é a recomendada para bots; 8% fica bem acima do pior drawdown já medido
  # (2,4% no corpus de julho), então só dispara em degradação real. 0 desliga.
  EXECUTOR_MAX_DRAWDOWN_PCT: "0.08"
  # Entrada como MAKER: posta ordem limite no lado passivo do book em vez de
  # atravessar o spread. Economiza duas coisas — taxa (0,020% contra 0,055%) e
  # o spread —, levando o custo de ida e volta de 0,130% para 0,040%.
  # Medido em 7,6 dias e 11 símbolos: 84% preenchem em 5 min, e quem preenche
  # tem MFE seguinte igual a quem entrou a mercado (0,290% vs 0,294%) — não há
  # seleção adversa neste horizonte. A SAÍDA segue a mercado de propósito:
  # stop e trailing existem para sair agora, não para esperar preço.
  # 0 desliga e volta a entrar a mercado.
  EXECUTOR_LIMIT_ENTRY_WAIT_SECS: "300"

  # System configuration
  HEALTH_CHECK_INTERVAL_MIN: "15"
  RECONCILIATION_INTERVAL_MIN: "5"
  ALERT_COOLDOWN_SEC: "300"

  # AI Analyst configuration — descriptive diagnostics + deterministic /sweep
  # backtest only (no LLM auto-tuning; tuning is manual via the backtest engine).
  AI_ANALYST_LOOKBACK_HOURS: "24"

  # Operator API configuration
  OPERATOR_AUTH_MODE: token

  # Web/API configuration
  BACKEND_API_URL: http://api:8080/api/v1
  NEXTAUTH_URL: http://localhost:30080

  # Logging
  LOG_LEVEL: info
  RUST_LOG: info
