apiVersion: v1
kind: ConfigMap
metadata:
  name: vipertrade-config
data:
  # Trading configuration
  TRADING_MODE: paper
  BYBIT_RECV_WINDOW: "5000"
  BYBIT_ACCOUNT_TYPE: UNIFIED

  # Database configuration
  POSTGRES_DB: vipertrade
  POSTGRES_USER: viper
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: vipertrade
  DB_USER: viper

  # Redis configuration
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379

  # Strategy configuration
  STRATEGY_CONFIG: /app/config/trading/pairs.yaml
  TUPA_AUDIT_PATH: /app/logs/audit
  TUPA_SEED: "42"
  TUPA_BACKEND: hybrid
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  LD_LIBRARY_PATH: /usr/local/lib

  # Service URLs (internal K8s DNS)
  WALLET_API_BASE_URL: http://api:8080
  ANALYTICS_SCORES_URL: http://analytics:8086/scores

  # Analytics configuration
  ANALYTICS_MIN_EVALUATED: "20"
  ANALYTICS_HORIZON_MINUTES: "5"
  ANALYTICS_LOOKBACK_HOURS: "24"
  ANALYTICS_SAMPLE_INTERVAL_SECONDS: "5"

  # Trading profile
  TRADING_PROFILE: MEDIUM

  # Strategy: use the real decision logic (ENTER_LONG/SHORT) instead of the
  # always-HOLD stub. Safe to enable here because TRADING_MODE=paper and
  # EXECUTOR_ENABLE_LIVE_ORDERS=false — fills are DB-simulated, no real orders.
  STRATEGY_REAL_DECISIONS: "true"

  # Executor configuration
  EXECUTOR_ENABLE_LIVE_ORDERS: "false"
  EXECUTOR_PAPER_MAX_OPEN_POSITIONS: "4"
  EXECUTOR_RECONCILE_FIX: "false"
  # Paper fills are charged the account's real Bybit taker rate, fetched from
  # /v5/account/fee-rate. This is only the fallback for when that call fails
  # (no credentials): Bybit USDT-perp non-VIP taker = 0.055%.
  EXECUTOR_FEE_TAKER_PCT: "0.00055"
  # Disjuntor: para as ENTRADAS quando o equity cai 8% desde o pico (curva
  # realizada). Posições abertas seguem sendo geridas — travar a saída
  # prenderia justamente o risco que o disjuntor quer reduzir. A faixa 5%-10%
  # é a recomendada para bots; 8% fica bem acima do pior drawdown já medido
  # (2,4% no corpus de julho), então só dispara em degradação real. 0 desliga.
  EXECUTOR_MAX_DRAWDOWN_PCT: "0.08"
  # Entrada como MAKER: posta ordem limite no lado passivo do book em vez de
  # atravessar o spread. Economiza duas coisas — taxa (0,020% contra 0,055%) e
  # o spread —, levando o custo de ida e volta de 0,130% para 0,040%.
  # Medido em 7,6 dias e 11 símbolos: 84% preenchem em 5 min, e quem preenche
  # tem MFE seguinte igual a quem entrou a mercado (0,290% vs 0,294%) — não há
  # seleção adversa neste horizonte. A SAÍDA segue a mercado de propósito:
  # stop e trailing existem para sair agora, não para esperar preço.
  # 0 desliga e volta a entrar a mercado.
  EXECUTOR_LIMIT_ENTRY_WAIT_SECS: "300"

  # System configuration
  HEALTH_CHECK_INTERVAL_MIN: "15"
  RECONCILIATION_INTERVAL_MIN: "5"
  ALERT_COOLDOWN_SEC: "300"

  # AI Analyst configuration — descriptive diagnostics + deterministic /sweep
  # backtest only (no LLM auto-tuning; tuning is manual via the backtest engine).
  AI_ANALYST_LOOKBACK_HOURS: "24"

  # Operator API configuration
  OPERATOR_AUTH_MODE: token

  # Web/API configuration
  BACKEND_API_URL: http://api:8080/api/v1
  NEXTAUTH_URL: http://localhost:30080

  # Logging
  LOG_LEVEL: info
  RUST_LOG: info
